<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="410" viewBox="0 0 1120 410" role="img" aria-labelledby="title desc"><title id="title">CYD YouTube Dashboard architecture</title><desc id="desc">Google YouTube Data API connects over validated HTTPS to ESP32 CYD, which drives the ST7789 screen and local admin interface; a browser on the local network configures the device.</desc><rect width="1120" height="410" rx="24" fill="#0c1220"/><g font-family="Arial,sans-serif"><text x="48" y="60" fill="#eef5ff" font-size="29" font-weight="700">CYD YouTube Dashboard</text><text x="48" y="88" fill="#98acc5" font-size="15">System architecture · ESP32-2432S028R / ST7789</text><g fill="#17243a" stroke="#426286" stroke-width="2"><rect x="50" y="145" width="250" height="145" rx="18"/><rect x="435" y="145" width="250" height="145" rx="18"/><rect x="820" y="145" width="250" height="145" rx="18"/></g><g fill="#f3f8ff" font-size="21" font-weight="700" text-anchor="middle"><text x="175" y="190">YouTube Data API</text><text x="560" y="190">ESP32 CYD</text><text x="945" y="190">ST7789 Display</text></g><g fill="#9bb3d1" font-size="15" text-anchor="middle"><text x="175" y="223">Public channel statistics</text><text x="175" y="248">Own API key per user</text><text x="560" y="223">Wi-Fi · NVS settings</text><text x="560" y="248">Touch · local HTTP admin</text><text x="945" y="223">320 × 240 dashboard</text><text x="945" y="248">Channel title + avatar</text></g><g stroke="#58d0bf" stroke-width="4" fill="none" stroke-linecap="round"><path d="M300 218 H433"/><path d="M685 218 H818"/><path d="M560 292 V340"/></g><g fill="#58d0bf"><path d="M424 210 L437 218 L424 226Z"/><path d="M809 210 L822 218 L809 226Z"/></g><g fill="#98acc5" font-size="14" text-anchor="middle"><text x="368" y="201">HTTPS + CA</text><text x="751" y="201">SPI</text><text x="560" y="365">Local browser setup · keep on trusted LAN</text></g></g></svg>