name: Build, test and publish safe installer landing page
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'installer-web/**'
      - '.github/workflows/pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: installer-web
      - id: deployment
        uses: actions/deploy-pages@v4
