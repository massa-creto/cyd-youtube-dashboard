name: Source checks and firmware build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: node --test installer-web/backup/*.test.mjs installer-web/preflight/*.test.mjs installer-web/install/*.test.mjs
  firmware-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install 'platformio==6.1.18'
      - run: pio run -d firmware -e cyd_st7789
      - uses: actions/upload-artifact@v5
        with:
          name: cyd-firmware-build-review-only
          path: |
            firmware/.pio/build/cyd_st7789/firmware.bin
            firmware/.pio/build/cyd_st7789/bootloader.bin
            firmware/.pio/build/cyd_st7789/partitions.bin
          if-no-files-found: error
